# KidsGameHub — publicação no GitHub Pages
# ElCamargo Soluções em TI LTDA
#
# PUBLICA POR TAG, e não por push na main.
#
# Antes, todo push na main ia direto para o celular das crianças. Isso é ruim
# justamente quando elas estão usando: uma alteração no meio de um teste chega
# sem ninguém decidir que era hora. Agora a main é onde se trabalha, e o que
# está no ar só muda quando alguém cria uma tag de versão.
#
# Para publicar: crie a tag (git tag -a v1.2.0 && git push origin v1.2.0).
# Para voltar a uma versão antiga, ou republicar sem tag nova: rode este
# workflow à mão pelo Actions, escolhendo a tag em "Use workflow from".
#
# NÃO BASTA MEXER AQUI: o ambiente github-pages tem regra própria de quem pode
# publicar, e ela está em Settings → Environments → github-pages. Lá só existe
# uma política, "tag: v*". Rodar este workflow a partir de uma BRANCH — main
# inclusive — é rejeitado com "is not allowed to deploy to github-pages due to
# environment protection rules". É de propósito: só tag vai ao ar.
#
# O portão de qualidade (ci.yml) continua rodando em todo push e todo PR, para
# nada quebrado chegar a virar tag.
name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
